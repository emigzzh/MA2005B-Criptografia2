options {
directory "/var/cache/bind/";
pid-file "/run/named/named-unsigned.pid";
session-keyfile "/run/named/session-unsigned.key";
listen-on { 172.30.0.20; };
listen-on-v6 { none; };
recursion no;
allow-query { any; };
};

controls { };

zone "unsigned" {
type primary;
file "/var/lib/bind/db.unsigned";
};
