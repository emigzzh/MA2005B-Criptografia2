options {
    directory "/var/cache/bind";

    listen-on { 172.30.0.101; };
    listen-on-v6 { none; };

    recursion yes;

    allow-recursion {
        172.30.0.0/24;
    };

    allow-query {
        172.30.0.0/24;
    };

    dnssec-validation yes;

    pid-file "/tmp/named-recursive2.pid";
};

zone "." {
    type hint;
    file "/var/lib/bind/db.root.hints";
};

trust-anchors {
    "." static-key 257 3 13 "sWlbcRjBDSkTglhZU42SOGveeXHmgq6geIaCvKx5jwc+AVL/XpXlXHrnLaGzfPoGOc8JTeaPgzxxzG1742RzDg==";
};
