options {
directory "/var/cache/bind";
pid-file "/run/named/named-alpha.pid";
session-keyfile "/run/named/session-alpha.key";
listen-on { 172.30.0.21; };
listen-on-v6 { none; };
recursion no;
allow-query { any; };
};

controls { };

zone "alpha.unsigned" {
type primary;
file "/var/lib/bind/db.alpha.unsigned";
};
